[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc           = "0.8.28"
# Sepolia 已過 Pectra;EIP-7702 需要 prague
evm_version    = "prague"
optimizer      = true
optimizer_runs = 200
via_ir         = false
fs_permissions = [{ access = "read", path = "./docs" }]

[fmt]
line_length = 100
tab_width   = 4
bracket_spacing = true

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC}"
